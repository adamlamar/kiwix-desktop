name: Build MSIX Package

on:
  push:
    branches: [ main, msix ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-msix:
    runs-on: windows-2022
    environment: dev

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install packages
      run: |
        choco.exe install pkgconfiglite

    - name: Install QT
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.8.1
        modules: "qtwebengine qtwebchannel qtmultimedia qtpositioning qtspeech"
        setup-python: false

    - name: Set Qt environment for MSIX
      shell: powershell
      run: |
        # The install-qt-action sets Qt6_Dir, but we need QT_ROOT_DIR for our script
        if ($env:Qt6_Dir) {
          echo "QT_ROOT_DIR=$env:Qt6_Dir" >> $env:GITHUB_ENV
          Write-Host "Set QT_ROOT_DIR to: $env:Qt6_Dir"
        } else {
          Write-Host "Warning: Qt6_Dir environment variable not set"
        }

        # Also try to find Qt bin directory
        $qtBinPath = ""
        if ($env:Qt6_Dir) {
          $qtBinPath = Join-Path $env:Qt6_Dir "bin"
        }

        if (-not [string]::IsNullOrEmpty($qtBinPath) -and (Test-Path $qtBinPath)) {
          Write-Host "Qt bin directory found: $qtBinPath"
          # List Qt DLLs to verify installation
          $qtDlls = Get-ChildItem "$qtBinPath\Qt*.dll" -ErrorAction SilentlyContinue
          if ($qtDlls) {
            Write-Host "Found Qt DLLs: $($qtDlls.Count) files"
            $qtDlls | Select-Object -First 5 | ForEach-Object { Write-Host "  - $($_.Name)" }
          } else {
            Write-Host "Warning: No Qt DLLs found in bin directory"
          }
        } else {
          Write-Host "Qt bin directory not found at expected location: $qtBinPath"
          # Try to find Qt installation elsewhere
          $possibleQtDirs = @(
            "${env:RUNNER_WORKSPACE}\Qt",
            "C:\Qt",
            "D:\a\kiwix-desktop\Qt"
          )
          foreach ($dir in $possibleQtDirs) {
            if (Test-Path $dir) {
              Write-Host "Found Qt directory at: $dir"
              Get-ChildItem $dir -Directory | ForEach-Object { Write-Host "  - $($_.Name)" }
            }
          }
        }

    - name: Setup MSVC compiler
      uses: bus1/cabuild/action/msdevshell@v1
      with:
        architecture: x64

    - name: Install dependencies
      uses: kiwix/kiwix-build/actions/dl_deps_archive@main
      with:
        target_platform: win-x86_64-mixed

    - name: Build application
      shell: cmd
      run: |
        set PKG_CONFIG_PATH=%cd%\BUILD_win-amd64\INSTALL\lib\pkgconfig
        qmake PREFIX=%cd%\BUILD_win-amd64\INSTALL
        nmake release-all

    - name: Debug Qt installation
      shell: powershell
      run: |
        Write-Host "Qt environment variables:" -ForegroundColor Cyan
        Get-ChildItem env: | Where-Object { $_.Name -like "*Qt*" } | ForEach-Object {
          Write-Host "  $($_.Name): $($_.Value)"
        }

        Write-Host "`nqmake location:" -ForegroundColor Cyan
        try {
          $qmakePath = Get-Command qmake -ErrorAction Stop
          Write-Host "  qmake: $($qmakePath.Source)"
          Write-Host "  Qt bin directory: $(Split-Path $qmakePath.Source)"
        } catch {
          Write-Host "  qmake not found in PATH"
        }

        Write-Host "`nLooking for Qt directories:" -ForegroundColor Cyan
        $qtPaths = @(
          "D:\a\kiwix-desktop\Qt",
          "C:\Qt",
          "${env:RUNNER_WORKSPACE}\Qt"
        )
        foreach ($path in $qtPaths) {
          if (Test-Path $path) {
            Write-Host "  Found: $path"
            Get-ChildItem $path -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "    - $($_.Name)"
            }
          } else {
            Write-Host "  Not found: $path"
          }
        }

    - name: Install Windows SDK (for MakeAppx)
      shell: powershell
      run: |
        # Download and install Windows 10 SDK if not available
        $sdkPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
        if (-not (Test-Path $sdkPath)) {
          Write-Host "Installing Windows 10 SDK..."
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2164145" -OutFile "winsdksetup.exe"
          Start-Process -FilePath "winsdksetup.exe" -ArgumentList "/quiet", "/features", "OptionId.WindowsDesktopDebuggers" -Wait
        } else {
          Write-Host "Windows 10 SDK is already installed"
        }

    - name: Prepare MSIX assets
      shell: powershell
      run: |
        # Create properly sized icon assets for MSIX
        $assetsDir = "Assets"
        New-Item -ItemType Directory -Path $assetsDir -Force

        # Copy the available icon as placeholders
        # In production, you'd want properly sized PNG files
        $iconSource = "resources\icons\kiwix\app_icon.ico"
        if (Test-Path $iconSource) {
          Copy-Item $iconSource "$assetsDir\StoreLogo.png" -Force
          Copy-Item $iconSource "$assetsDir\Square150x150Logo.png" -Force
          Copy-Item $iconSource "$assetsDir\Square44x44Logo.png" -Force
          Copy-Item $iconSource "$assetsDir\Wide310x150Logo.png" -Force
          Copy-Item $iconSource "$assetsDir\LargeTile.png" -Force
          Copy-Item $iconSource "$assetsDir\SmallTile.png" -Force
          Copy-Item $iconSource "$assetsDir\SplashScreen.png" -Force
          Copy-Item $iconSource "$assetsDir\ZimFileIcon.png" -Force
        }

        # Try to use PNG versions if available
        $png512 = "resources\icons\kiwix\512"
        if (Test-Path $png512) {
          Get-ChildItem "$png512\*.png" | ForEach-Object {
            Copy-Item $_.FullName "$assetsDir\Square150x150Logo.png" -Force
            Copy-Item $_.FullName "$assetsDir\StoreLogo.png" -Force
          }
        }

    - name: Create MSIX package
      shell: powershell
      run: |
        # Set version from git tag or default
        $version = "2.4.1.0"
        if ($env:GITHUB_REF -match "refs/tags/v(.+)") {
          $tagVersion = $matches[1]
          # Convert semantic version to Windows version format (x.y.z.w)
          if ($tagVersion -match "^(\d+)\.(\d+)\.(\d+)") {
            $version = "$($matches[1]).$($matches[2]).$($matches[3]).0"
          }
        }

        Write-Host "Building MSIX package version: $version"

        # Run our PowerShell build script
        .\scripts\build-msix.ps1 -BuildPath "$PWD" -OutputPath "$PWD\kiwix-desktop-$version.msix" -Version $version -Architecture "x64"

    - name: Validate signing certificate
      shell: powershell
      run: |
        if (-not $env:SIGNING_CERTIFICATE -or -not $env:SIGNING_PASSWORD) {
          Write-Host "❌ MSIX signing requires a certificate!" -ForegroundColor Red
          Write-Host ""
          Write-Host "To fix this, add these secrets to your GitHub repository:" -ForegroundColor Yellow
          Write-Host "  SIGNING_CERTIFICATE - Base64 encoded .pfx certificate file" -ForegroundColor Gray
          Write-Host "  SIGNING_PASSWORD - Certificate password" -ForegroundColor Gray
          Write-Host ""
          Write-Host "For development/testing, create a self-signed certificate:" -ForegroundColor Yellow
          Write-Host "  1. Run: .\scripts\create-dev-cert.ps1" -ForegroundColor Gray
          Write-Host "  2. Convert to base64: [Convert]::ToBase64String([IO.File]::ReadAllBytes('cert.pfx'))" -ForegroundColor Gray
          Write-Host "  3. Add the base64 string to SIGNING_CERTIFICATE secret" -ForegroundColor Gray
          Write-Host "  4. Add the password to SIGNING_PASSWORD secret" -ForegroundColor Gray
          Write-Host ""
          Write-Host "For production, purchase a code signing certificate from a trusted CA." -ForegroundColor Yellow
          Write-Error "Missing required signing certificate secrets"
          exit 1
        }

        Write-Host "✅ Signing certificate secrets are available" -ForegroundColor Green
      env:
        SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    - name: Sign MSIX package
      shell: powershell
      run: |
        Write-Host "Signing MSIX package..." -ForegroundColor Yellow

        # Create certificate file from base64
        $certBytes = [Convert]::FromBase64String($env:SIGNING_CERTIFICATE)
        $certPath = "signing-cert.pfx"
        [IO.File]::WriteAllBytes($certPath, $certBytes)

        # Find SignTool
        $signToolPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
        if (-not (Test-Path $signToolPath)) {
          $WindowsKitsPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signToolPath = Get-ChildItem -Path $WindowsKitsPath -Recurse -Filter "signtool.exe" |
                         Where-Object { $_.Directory.Name -like "*x64*" } |
                         Sort-Object Name -Descending |
                         Select-Object -First 1 -ExpandProperty FullName
        }

        if (-not (Test-Path $signToolPath)) {
          Write-Error "SignTool not found. Please install Windows SDK."
          exit 1
        }

        # Find MSIX file
        $msixFile = Get-ChildItem "*.msix" | Select-Object -First 1
        if (-not $msixFile) {
          Write-Error "No MSIX package found to sign."
          exit 1
        }

        Write-Host "Using SignTool: $signToolPath" -ForegroundColor Cyan
        Write-Host "Signing package: $($msixFile.Name)" -ForegroundColor Cyan

        # Sign the package with timestamp
        & $signToolPath sign /fd SHA256 /f $certPath /p $env:SIGNING_PASSWORD /tr http://timestamp.digicert.com /td sha256 $msixFile.FullName

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to sign MSIX package (exit code: $LASTEXITCODE)"
          Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          exit 1
        }

        Write-Host "✅ MSIX package signed successfully" -ForegroundColor Green

        # Clean up certificate file
        Remove-Item $certPath -Force

        # Verify the signature (don't fail on verification errors for self-signed certs)
        Write-Host "Verifying package signature..." -ForegroundColor Yellow
        & $signToolPath verify /pa /v $msixFile.FullName
        if ($LASTEXITCODE -eq 0) {
          Write-Host "✅ Package signature verified" -ForegroundColor Green
        } else {
          Write-Host "⚠️  Package signature verification failed (expected for self-signed certificates)" -ForegroundColor Yellow
          Write-Host "This is normal for development certificates and doesn't affect package functionality" -ForegroundColor Gray
        }

        # Reset exit code to success since verification failure is expected
        $global:LASTEXITCODE = 0
      env:
        SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

    - name: Prepare artifact directory
      shell: powershell
      run: |
        Write-Host "Preparing artifact directory structure..." -ForegroundColor Yellow

        # Create artifact directory structure
        $artifactDir = "msix-package"
        $msixContentDir = Join-Path $artifactDir "msix-contents"

        New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
        New-Item -ItemType Directory -Path $msixContentDir -Force | Out-Null

        # Copy MSIX package file
        $msixFile = Get-ChildItem "*.msix" | Select-Object -First 1
        if ($msixFile) {
          Copy-Item $msixFile.FullName (Join-Path $artifactDir $msixFile.Name) -Force
          Write-Host "Copied MSIX package: $($msixFile.Name)" -ForegroundColor Green
        }

        # Copy Package.appxmanifest
        if (Test-Path "Package.appxmanifest") {
          Copy-Item "Package.appxmanifest" $msixContentDir -Force
          Write-Host "Copied Package.appxmanifest" -ForegroundColor Green
        }

        # Copy all troubleshooting scripts
        $scriptFiles = @(
          "scripts\qt-diagnostics.ps1",
          "scripts\debug-msix-app.ps1",
          "scripts\debug-msix-environment.ps1",
          "scripts\fix-msix-execution.ps1",
          "scripts\webengine-msix-compat.ps1",
          "scripts\launch-kiwix-workaround.ps1",
          "scripts\installation-success.ps1"
        )

        foreach ($script in $scriptFiles) {
          if (Test-Path $script) {
            $fileName = Split-Path $script -Leaf
            Copy-Item $script (Join-Path $msixContentDir $fileName) -Force
            Write-Host "Copied troubleshooting script: $fileName" -ForegroundColor Green
          }
        }

        # Copy build script
        if (Test-Path "scripts\build-msix.ps1") {
          Copy-Item "scripts\build-msix.ps1" $msixContentDir -Force
          Write-Host "Copied build-msix.ps1" -ForegroundColor Green
        }

        # Copy executable if available
        $exePath = "release\kiwix-desktop.exe"
        if (Test-Path $exePath) {
          Copy-Item $exePath $msixContentDir -Force
          $exeInfo = Get-Item (Join-Path $msixContentDir "kiwix-desktop.exe")
          Write-Host "Copied executable: $([math]::Round($exeInfo.Length / 1MB, 2)) MB" -ForegroundColor Green
        }

        # Copy Assets directory if it exists
        if (Test-Path "Assets") {
          Copy-Item "Assets" $msixContentDir -Recurse -Force
          Write-Host "Copied Assets directory" -ForegroundColor Green
        }

        # Create README for the artifact
        $readmeContent = @"
# Kiwix Desktop MSIX Package Contents

This artifact contains the complete Kiwix Desktop MSIX package and all related files.

## Files Included:

### MSIX Package
- kiwix-desktop-*.msix - The signed MSIX package ready for installation

### MSIX Contents (msix-contents/)
- Package.appxmanifest - MSIX application manifest
- kiwix-desktop.exe - Main application executable
- Assets/ - Application icons and resources
- build-msix.ps1 - PowerShell build script

### Troubleshooting Scripts (msix-contents/)
- qt-diagnostics.ps1 - Qt environment diagnostics
- debug-msix-app.ps1 - Basic MSIX debugging
- debug-msix-environment.ps1 - Comprehensive MSIX environment analysis
- fix-msix-execution.ps1 - MSIX execution fixes
- webengine-msix-compat.ps1 - Qt WebEngine MSIX compatibility
- launch-kiwix-workaround.ps1 - Alternative launch methods
- installation-success.ps1 - Installation success verification

## Installation Instructions:

1. Install the MSIX package:
   ``````
   Add-AppxPackage -Path "kiwix-desktop-*.msix"
   ``````

2. Launch from Windows Start Menu by searching for "Kiwix"

3. If you encounter issues, run the troubleshooting scripts from the installed package directory:
   ``````
   cd "C:\Program Files\WindowsApps\KiwixFoundation.Kiwix_*"
   powershell -ExecutionPolicy Bypass -File "installation-success.ps1"
   ``````

## For Developers:

The msix-contents/ directory contains all the files that are packaged inside the MSIX,
including troubleshooting tools that are available when the package is installed.
"@

        $readmeContent | Set-Content (Join-Path $artifactDir "README.md") -Encoding UTF8
        Write-Host "Created README.md" -ForegroundColor Green

        Write-Host "`nArtifact directory structure:" -ForegroundColor Cyan
        Get-ChildItem $artifactDir -Recurse | ForEach-Object {
          $indent = "  " * ($_.FullName.Split('\').Count - $artifactDir.Split('\').Count - 1)
          Write-Host "$indent$($_.Name)" -ForegroundColor Gray
        }

    - name: Upload MSIX package
      uses: actions/upload-artifact@v4
      with:
        name: kiwix-desktop-msix
        path: msix-package/
        retention-days: 30

    - name: Upload to release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: "*.msix"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Validate MSIX package
      shell: powershell
      run: |
        # Basic validation of the created MSIX package
        $msixFile = Get-ChildItem "*.msix" | Select-Object -First 1
        if ($msixFile) {
          Write-Host "MSIX package created: $($msixFile.Name)"
          Write-Host "File size: $([math]::Round($msixFile.Length / 1MB, 2)) MB"

          # Try to get package info (requires Add-AppxPackage cmdlets)
          try {
            $packageInfo = Get-AppxPackageManifest -Path $msixFile.FullName -ErrorAction SilentlyContinue
            if ($packageInfo) {
              Write-Host "Package validation successful"
              Write-Host "Package Identity: $($packageInfo.Package.Identity.Name)"
              Write-Host "Package Version: $($packageInfo.Package.Identity.Version)"
            }
          } catch {
            Write-Host "Note: Could not validate package manifest (this is normal in CI)"
          }
        } else {
          Write-Error "No MSIX package found!"
          exit 1
        }
