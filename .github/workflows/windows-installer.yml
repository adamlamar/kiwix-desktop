name: Windows Installer

on:
  pull_request:
    paths:
      - 'src/**'
      - 'resources/**'
      - 'ui/**'
      - 'kiwix-desktop.pro'
      - '.github/workflows/windows-installer.yml'
      - 'kiwix-desktop.iss'
      - 'deploy-windows.ps1'
  push:
    branches:
      - main
      - innosetup
  release:
    types: [published]

env:
  QT_VERSION: 6.8.1
  CMAKE_BUILD_TYPE: Release

jobs:
  build-windows-installer:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install system dependencies
      run: |
        choco install pkgconfiglite innosetup --yes
        # Install Visual C++ Redistributable (use correct package name)
        choco install vcredist140 --yes || echo "vcredist140 installation failed or already installed"

    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        modules: 'qtwebengine qtwebchannel qtpositioning'
        setup-python: false
        cache: true

    - name: Verify Qt installation
      shell: pwsh
      run: |
        Write-Host "=== Qt Installation Diagnostics ===" -ForegroundColor Cyan
        Write-Host "Environment Variables:"
        Write-Host "  Qt6_DIR: $env:Qt6_DIR"
        Write-Host "  QT_ROOT_DIR: $env:QT_ROOT_DIR"
        Write-Host "  RUNNER_WORKSPACE: $env:RUNNER_WORKSPACE"

        Write-Host "`nSearching for Qt installations..."

        # Check RUNNER_WORKSPACE for Qt
        $runnerQtPath = "$env:RUNNER_WORKSPACE\Qt"
        if (Test-Path $runnerQtPath) {
          Write-Host "✓ Found Qt directory at: $runnerQtPath" -ForegroundColor Green
          Get-ChildItem -Path $runnerQtPath -Directory | ForEach-Object {
            Write-Host "  Qt version directory: $($_.Name)"
            $msvcPath = Join-Path $_.FullName "msvc2022_64"
            if (Test-Path $msvcPath) {
              Write-Host "    ✓ MSVC2022_64 directory found" -ForegroundColor Green
              if (Test-Path "$msvcPath\bin\qmake.exe") {
                Write-Host "    ✓ qmake.exe found" -ForegroundColor Green
              }
              if (Test-Path "$msvcPath\bin\windeployqt.exe") {
                Write-Host "    ✓ windeployqt.exe found" -ForegroundColor Green
                Write-Host "QT_INSTALL_PATH=$msvcPath" >> $env:GITHUB_ENV
                Write-Host "Setting QT_INSTALL_PATH to: $msvcPath" -ForegroundColor Yellow
              }
            }
          }
        } else {
          Write-Host "✗ No Qt directory found at: $runnerQtPath" -ForegroundColor Red
        }

        # List all Qt-related directories
        Write-Host "`nAll Qt-related files in workspace:"
        Get-ChildItem -Path $env:RUNNER_WORKSPACE -Filter "*qt*" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object {
          Write-Host "  $($_.FullName)"
        }

    - name: Setup MSVC compiler
      uses: bus1/cabuild/action/msdevshell@v1
      with:
        architecture: x64

    - name: Install kiwix dependencies
      uses: kiwix/kiwix-build/actions/dl_deps_archive@main
      with:
        target_platform: win-x86_64-mixed

    - name: Build application
      shell: cmd
      run: |
        set PKG_CONFIG_PATH=%cd%\BUILD_win-amd64\INSTALL\lib\pkgconfig
        echo Building with Qt version: %Qt6_DIR%
        qmake --version
        qmake PREFIX=%cd%\BUILD_win-amd64\INSTALL kiwix-desktop.pro CONFIG+=release
        nmake release

    - name: List build outputs
      shell: pwsh
      run: |
        Write-Host "Build directory contents:"
        Get-ChildItem -Path "." -Filter "*.exe" -Recurse | Select-Object FullName
        Write-Host "`nRelease directory:"
        if (Test-Path "release") {
          Get-ChildItem -Path "release" | Select-Object Name, Length
        } else {
          Write-Host "Release directory not found"
        }

    - name: Build runtime test
      shell: cmd
      run: |
        echo Building runtime test...
        echo Current directory: %cd%
        echo Looking for runtime-test.cpp...
        if exist "runtime-test.cpp" (
          echo Found runtime-test.cpp
        ) else (
          echo runtime-test.cpp not found in current directory
          dir *.cpp
        )

        if not exist "release" mkdir release
        cl /EHsc runtime-test.cpp /Fe:release/runtime-test.exe
        if %ERRORLEVEL% NEQ 0 (
          echo Runtime test build failed
        ) else (
          echo Runtime test built successfully
          dir release\runtime-test.exe
        )

    - name: Deploy application with Qt6 libraries
      shell: pwsh
      run: |
        # Use Qt path from environment variables in order of preference
        $qtPath = $null

        $qtCandidates = @(
          $env:QT_INSTALL_PATH,
          $env:QT_ROOT_DIR,
          $env:Qt6_DIR
        )

        foreach ($candidate in $qtCandidates) {
          if ($candidate -and (Test-Path "$candidate\bin\windeployqt.exe")) {
            $qtPath = $candidate
            Write-Host "✓ Found Qt at: $qtPath" -ForegroundColor Green
            break
          }
        }

        if (-not $qtPath) {
          Write-Host "Qt environment variables:" -ForegroundColor Yellow
          Write-Host "  QT_INSTALL_PATH: $env:QT_INSTALL_PATH"
          Write-Host "  QT_ROOT_DIR: $env:QT_ROOT_DIR"
          Write-Host "  Qt6_DIR: $env:Qt6_DIR"
          Write-Error "✗ Could not find Qt installation with windeployqt"
          exit 1
        }

        Write-Host "Using Qt path: $qtPath"
        .\deploy-windows.ps1 -BuildPath "release" -QtPath "$qtPath" -OutputPath "dist" -DepsPath "$env:GITHUB_WORKSPACE\BUILD_win-amd64\INSTALL"

    - name: Verify deployment
      shell: pwsh
      run: |
        Write-Host "=== Deployment Verification ===" -ForegroundColor Cyan

        if (Test-Path "dist\kiwix-desktop.exe") {
          Write-Host "✓ Main executable found" -ForegroundColor Green

          # Check executable dependencies with dumpbin if available
          $dumpbin = Get-Command "dumpbin.exe" -ErrorAction SilentlyContinue
          if ($dumpbin) {
            Write-Host "`nExecutable dependencies:" -ForegroundColor Yellow
            & dumpbin /dependents "dist\kiwix-desktop.exe" | Select-String "\.dll"
          }
        } else {
          Write-Error "✗ Main executable missing"
        }

        # Enhanced Qt library verification
        Write-Host "`nQt6 Libraries Check:" -ForegroundColor Yellow
        $requiredQtLibs = @(
          "Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll",
          "Qt6WebEngineWidgets.dll", "Qt6WebEngineCore.dll", "Qt6WebChannel.dll",
          "Qt6Network.dll", "Qt6PrintSupport.dll", "Qt6Positioning.dll"
        )

        foreach ($lib in $requiredQtLibs) {
          if (Test-Path "dist\$lib") {
            Write-Host "✓ $lib found" -ForegroundColor Green
          } else {
            Write-Host "✗ $lib missing" -ForegroundColor Red
          }
        }

        # Check for VC++ Redistributables
        Write-Host "`nVC++ Redistributable Check:" -ForegroundColor Yellow
        $vcLibs = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
        foreach ($lib in $vcLibs) {
          if (Test-Path "dist\$lib") {
            Write-Host "✓ $lib found" -ForegroundColor Green
          } else {
            Write-Host "✗ $lib missing" -ForegroundColor Red
          }
        }

        # Check platforms directory
        Write-Host "`nQt Platform Plugins:" -ForegroundColor Yellow
        if (Test-Path "dist\platforms") {
          $platforms = Get-ChildItem "dist\platforms" -Filter "*.dll"
          foreach ($platform in $platforms) {
            Write-Host "✓ $($platform.Name)" -ForegroundColor Green
          }
          if (-not $platforms) {
            Write-Host "✗ No platform plugins found" -ForegroundColor Red
          }
        } else {
          Write-Host "✗ platforms directory missing" -ForegroundColor Red
        }

        # Check other critical directories
        $criticalDirs = @("imageformats", "styles", "tls")
        foreach ($dir in $criticalDirs) {
          if (Test-Path "dist\$dir") {
            $files = (Get-ChildItem "dist\$dir" -File).Count
            Write-Host "✓ $dir directory ($files files)" -ForegroundColor Green
          } else {
            Write-Host "⚠ $dir directory missing" -ForegroundColor Yellow
          }
        }

        # List all files for debugging
        Write-Host "`nComplete file listing:" -ForegroundColor Cyan
        Get-ChildItem -Path "dist" -Recurse | ForEach-Object {
          $relativePath = $_.FullName.Replace((Resolve-Path "dist").Path, "")
          if ($_.PSIsContainer) {
            Write-Host "  📁 $relativePath" -ForegroundColor Blue
          } else {
            $sizeKB = [math]::Round($_.Length / 1KB, 1)
            Write-Host "  📄 $relativePath ($sizeKB KB)" -ForegroundColor Gray
          }
        }

        Write-Host "`nTotal deployed files: $((Get-ChildItem -Path "dist" -Recurse -File).Count)"

    - name: Test executable launch
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "=== Testing Executable Launch ===" -ForegroundColor Cyan

        # Try to get version info
        try {
          Write-Host "Checking executable properties..."
          $exe = Get-Item "dist\kiwix-desktop.exe"
          Write-Host "File size: $($exe.Length) bytes"
          Write-Host "Last modified: $($exe.LastWriteTime)"

          # Try to get version info if available
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe.FullName)
          Write-Host "File version: $($version.FileVersion)"
          Write-Host "Product version: $($version.ProductVersion)"
        }
        catch {
          Write-Warning "Could not get file version info: $($_.Exception.Message)"
        }

        # Try to launch with --version flag (common Qt pattern)
        Write-Host "`nTrying to launch with --version..."
        try {
          $process = Start-Process -FilePath "dist\kiwix-desktop.exe" -ArgumentList "--version" -Wait -PassThru -RedirectStandardOutput "version_output.txt" -RedirectStandardError "version_error.txt" -NoNewWindow
          Write-Host "Process exit code: $($process.ExitCode)"

          if (Test-Path "version_output.txt") {
            $output = Get-Content "version_output.txt" -Raw
            if ($output) {
              Write-Host "Standard output: $output"
            }
          }

          if (Test-Path "version_error.txt") {
            $error = Get-Content "version_error.txt" -Raw
            if ($error) {
              Write-Host "Standard error: $error" -ForegroundColor Yellow
            }
          }
        }
        catch {
          Write-Warning "Could not launch executable: $($_.Exception.Message)"
        }

    - name: Create installer with Inno Setup
      shell: cmd
      run: |
        echo Creating installer...
        "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /Q kiwix-desktop.iss
        if %ERRORLEVEL% NEQ 0 (
          echo Inno Setup failed with exit code %ERRORLEVEL%
          exit /b %ERRORLEVEL%
        )
        echo Installer created successfully

    - name: Verify installer creation
      shell: pwsh
      run: |
        $installerPath = "installer\kiwix-desktop-2.4.1-windows-installer.exe"
        if (Test-Path $installerPath) {
          $size = (Get-Item $installerPath).Length / 1MB
          Write-Host "✓ Installer created: $installerPath ($([math]::Round($size, 2)) MB)" -ForegroundColor Green
        } else {
          Write-Error "✗ Installer not found at expected location"
        }

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: kiwix-desktop-windows-installer
        path: installer/*.exe
        retention-days: 30

    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kiwix-desktop-windows-portable
        path: dist/
        retention-days: 30

    - name: Upload installer to release
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: installer/kiwix-desktop-2.4.1-windows-installer.exe
        asset_name: kiwix-desktop-${{ github.event.release.tag_name }}-windows-installer.exe
        asset_content_type: application/octet-stream
